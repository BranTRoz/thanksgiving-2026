<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3eee8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a241f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Weekly Groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm weekly list you can use one-handed in a grocery aisle.
   IDEA: the paper list in your pocket, but it crosses itself off and hides what's done.
   PICTURE: the list itself, big tap rows grouped by store section, with a running count on top.
   COLOUR and TYPE: warm stone header, white list, gold checks; Familjen Grotesk + Figtree, matching the cooking guide.
   LAYOUT: one column, sticky header with progress and a Hide done switch, sections down the page. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#16110f);--ink:light-dark(#1d1916,#f3ece6);--mute:light-dark(#655c55,#b9ada3);
--line:light-dark(#ebe4dd,#352c27);--head:light-dark(#f3eee8,#2a241f);--track:light-dark(#e2d9cf,#4a3f36);
--gold:#e8a92b;--sage:light-dark(#5f8a4f,#8fbf7c);--sageBg:light-dark(#eef5ea,#1f2a1b);--sageInk:light-dark(#ffffff,#12200d);--goldInk:#3a2600;--card:light-dark(#faf6f2,#211a17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:3;background:var(--head);border-bottom:1px solid var(--line);padding:14px 18px 12px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font:700 24px/1.1 "Familjen Grotesk",Figtree,sans-serif;margin:0}
.count{font:700 22px "Familjen Grotesk",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font:500 13px Figtree,sans-serif;color:var(--mute);margin-left:4px}
.bar{height:6px;border-radius:9px;background:var(--track);overflow:hidden;margin:10px 0 10px}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;cursor:pointer;font-weight:600;font-size:15px}
.sw .tr{width:46px;height:28px;border-radius:99px;background:var(--track);position:relative;transition:background .2s}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked=true] .tr{background:var(--gold)}.sw[aria-checked=true] .tr::after{transform:translateX(18px)}
.dishes{font-size:13px;color:var(--mute)}
main{padding:4px 0 40px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:22px 18px 8px;border-bottom:2px solid var(--ink);margin:0 0 0}
.sec h2{font:700 20px "Familjen Grotesk",sans-serif;margin:0}.sec span{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.row{flex:1;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 18px;min-height:60px;cursor:pointer}
.ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--mute);display:grid;place-items:center}
.ck svg{width:16px;height:16px;opacity:0;stroke:var(--goldInk)}
.nm{font-weight:600}.dt{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.opt{font-size:12px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
.row.done .ck{background:var(--gold);border-color:var(--gold)}.row.done .ck svg{opacity:1}
.row.done .nm,.row.done .dt{text-decoration:line-through;opacity:.55}
.del{background:none;border:0;color:var(--mute);min-width:44px;min-height:44px;font-size:22px;cursor:pointer}
.add{display:flex;gap:10px;padding:16px 18px}
.add input{flex:1;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);font-size:16px}
.add button{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--gold);color:var(--goldInk);font-weight:700;cursor:pointer}
.empty{margin:28px 18px;padding:22px;border-radius:16px;background:var(--card);font-size:18px;font-weight:600;text-align:center}
.foot{display:flex;justify-content:center;padding:18px}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer;font-weight:600;color:var(--mute)}
.ghost.arm{border-color:#b3261e;color:#b3261e}
.pill{border:1.5px solid var(--ink);background:transparent;border-radius:999px;min-height:40px;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer}
.go{border:0;border-radius:12px;background:var(--gold);color:var(--goldInk);font-weight:700;min-height:44px;padding:0 20px;cursor:pointer;font-size:16px}
.hint{font-size:14px;color:var(--mute)}
.admin .row.on{background:var(--sageBg)}.admin .row.on .ck{background:var(--sage);border-color:var(--sage)}.admin .row.on .ck svg{opacity:1;stroke:var(--sageInk)}
.empty p{margin:0 0 14px}
@media(min-width:700px){main,.hw{max-width:640px;margin-inline:auto}}
@media(prefers-reduced-motion:reduce){.bar i,.sw .tr,.sw .tr::after{transition:none}}
</style>
</head>
<body>
<header><div class="hw" id="head"></div></header>
<main id="main"></main>
<script>
{
const LIST=[["Produce",[["w-bananas","Bananas",''],["w-grapes","Grapes",''],["w-fruit-seasonal","Fruit (seasonal)",''],["w-salad-mix","Salad mix",''],["w-avocados","Avocados",''],["w-carrots","Carrots",''],["w-celery","Celery",''],["w-onions","Onions",''],["w-potatoes","Potatoes",'']]],
 ["Bakery",[["w-bread","Bread",''],["w-baguette","Baguette",'']]],
 ["Meat and seafood",[["w-chicken-thighs","Chicken thighs",''],["w-salmon","Salmon",''],["w-steak","Steak",''],["w-stew-beef","Stew beef",'']]],
 ["Dairy and eggs",[["w-eggs","Eggs",''],["w-butter","Butter",''],["w-soy-milk-silk-vanilla","Soy milk (Silk Vanilla)",''],["w-yogurt-meyer-lemon","Yogurt, Meyer lemon",''],["w-yoplait-whips","Yoplait Whips",''],["w-cheese-sticks","Cheese sticks",''],["w-sliced-cheddar","Sliced cheddar",''],["w-shredded-cheese","Shredded cheese",'']]],
 ["Pantry",[["w-cereal","Cereal",''],["w-rice","Rice",''],["w-pasta","Pasta",''],["w-egg-noodles","Egg noodles",''],["w-lentils","Lentils",''],["w-dried-peas","Dried peas",''],["w-white-beans","White beans",''],["w-crushed-tomatoes","Crushed tomatoes",''],["w-chicken-broth","Chicken broth",''],["w-beef-broth","Beef broth",''],["w-artichoke-hearts-canned","Artichoke hearts, canned",''],["w-avocado-oil","Avocado oil",''],["w-sunbutter","SunButter",''],["w-jif-peanut-butter","Jif peanut butter",''],["w-honey","Honey",''],["w-pancake-mix","Pancake mix",'']]],
 ["Snacks",[["w-crackers-for-cheese","Crackers (for cheese)",''],["w-corn-chips","Corn chips",''],["w-potato-chips","Potato chips",''],["w-pretzels","Pretzels",''],["w-licorice","Licorice",''],["w-fresca","Fresca",'']]],
 ["Beverages",[["w-coffee","Coffee",''],["w-tea","Tea",''],["w-apple-juice","Apple juice",'']]],
 ["Frozen",[["w-bao-buns","Bao buns",''],["w-peas","Peas",''],["w-turkey-meatballs","Turkey meatballs",'']]],
 ["Household and paper",[["w-foil","Foil",''],["w-foil-pans-8-8","Foil pans, 8×8",''],["w-bounty-paper-towels","Bounty paper towels",''],["w-toilet-paper","Toilet paper",''],["w-garbage-bags","Garbage bags",''],["w-windex","Windex",'']]]];
const KEY='weekly-list-v2';
let st={sel:[],done:[],hide:false,extra:[],mode:null};
try{st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let sel=new Set(st.sel),done=new Set(st.done),armT=null,armR=null;
if(!st.mode)st.mode=sel.size?'shop':'admin';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({sel:[...sel],done:[...done],hide:st.hide,extra:st.extra,mode:st.mode}))}catch(e){}};
const CK='<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const head=document.getElementById('head'),main=document.getElementById('main');
const sections=()=>[...LIST,['Extras',st.extra.map(x=>[x.id,x.name,'',false,true])]];
const addForm=()=>`<form class="add" id="add"><input id="newItem" placeholder="Paper plates" aria-label="Add an item" autocomplete="off"><button type="submit">Add</button></form>`;
const row=(id,nm,on,cls,mine)=>`<div style="display:flex"><button class="row${on?' '+cls:''}" data-id="${id}" aria-pressed="${on}"><span class="ck" aria-hidden="true">${CK}</span><span><span class="nm">${esc(nm)}</span></span><span></span></button>${mine?`<button class="del" data-del="${id}" aria-label="Remove ${esc(nm)}">×</button>`:''}</div>`;
function renderShop(){
 const mine=sections().flatMap(s=>s[1]).filter(i=>sel.has(i[0])),n=mine.filter(i=>done.has(i[0])).length,left=mine.length-n;
 head.innerHTML=`<div class="top"><h1>Shopping List</h1><div class="count">${left}<small>to get</small></div></div><div class="bar"><i style="width:${mine.length?Math.round(n/mine.length*100):0}%"></i></div><div class="ctrl"><button class="sw" id="hide" role="switch" aria-checked="${st.hide}"><span class="tr" aria-hidden="true"></span>Hide done</button><button class="pill" data-mode="admin">Build List</button></div>`;
 if(!sel.size){main.className='shop';main.innerHTML=`<div class="empty"><p>No items picked for this week.</p><button class="go" data-mode="admin">Build List</button></div><div class="sec"><h2>Extras</h2><span></span></div>${addForm()}`;return}
 let html='';
 for(const [name,items] of sections()){
  const picked=items.filter(i=>sel.has(i[0])),shown=picked.filter(i=>!(st.hide&&done.has(i[0])));
  if(name!=='Extras'&&!shown.length)continue;
  html+=`<div class="sec"><h2>${name}</h2><span>${picked.filter(i=>done.has(i[0])).length}/${picked.length}</span></div>`;
  html+=shown.map(i=>row(i[0],i[1],done.has(i[0]),'done',false)).join('');
  if(name==='Extras')html+=addForm();
 }
 if(left===0)html=`<div class="empty"><p>Everything’s in the cart.</p></div>`+html;
 html+=`<div class="foot"><button class="ghost" id="reset">Uncheck everything</button></div>`;
 main.className='shop';main.innerHTML=html;
}
function renderAdmin(){
 head.innerHTML=`<div class="top"><h1>Build List</h1><div class="count">${sel.size}<small>picked</small></div></div><div class="ctrl" style="margin-top:8px"><span class="hint">Tap what you need this week.</span><button class="go" data-mode="shop">Done</button></div>`;
 let html='';
 for(const [name,items] of sections()){
  html+=`<div class="sec"><h2>${name}</h2><span>${items.filter(i=>sel.has(i[0])).length}/${items.length}</span></div>`;
  html+=items.map(i=>row(i[0],i[1],sel.has(i[0]),'on',i[4])).join('');
  if(name==='Extras')html+=addForm();
 }
 html+=`<div class="foot"><button class="ghost" id="clearSel">Clear all picks</button></div>`;
 main.className='admin';main.innerHTML=html;
}
function render(){st.mode==='admin'?renderAdmin():renderShop()}
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-mode]');if(m){st.mode=m.dataset.mode;save();render();window.scrollTo(0,0);return}
 if(e.target.closest('#hide')){st.hide=!st.hide;save();render();return}
 const d=e.target.closest('[data-del]');if(d){const id=d.dataset.del;st.extra=st.extra.filter(x=>x.id!==id);sel.delete(id);done.delete(id);save();render();return}
 const r=e.target.closest('.row');if(r){const id=r.dataset.id;
  if(st.mode==='admin'){if(sel.has(id)){sel.delete(id);done.delete(id)}else sel.add(id)}
  else{done.has(id)?done.delete(id):done.add(id)}
  save();render();return}
 const b=e.target.closest('#reset');if(b){
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Tap again to uncheck all';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('arm');b.textContent='Uncheck everything'},3000);return}
  done.clear();save();render();return}
 const c=e.target.closest('#clearSel');if(c){
  if(!c.classList.contains('arm')){c.classList.add('arm');c.textContent='Tap again to clear all picks';clearTimeout(armR);armR=setTimeout(()=>{c.classList.remove('arm');c.textContent='Clear all picks'},3000);return}
  sel.clear();done.clear();save();render()}
});
main.addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('newItem'),v=i.value.trim();if(!v)return;
 const ex=sections().flatMap(s=>s[1]).find(x=>x[1].toLowerCase()===v.toLowerCase());
 const id=ex?ex[0]:'x'+Date.now();if(!ex)st.extra.push({id,name:v});sel.add(id);save();render();const n=document.getElementById('newItem');if(n)n.focus()});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
