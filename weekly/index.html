<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3eee8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a241f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Weekly Groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the same calm, one-handed list as the Thanksgiving shopping app, built for every week.
   IDEA: a standing grocery checklist: plan at home by picking from your usuals, then shop only what you picked.
   PICTURE: the list itself, big tap rows in aisle order, with a Plan / Shop switch on top.
   COLOUR and TYPE: warm stone header, white list, sage for picked items, gold for items in the cart; Familjen Grotesk + Figtree.
   LAYOUT: one column, sticky header with the mode switch and count, sections down the page, add form at the end. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#16110f);--ink:light-dark(#1d1916,#f3ece6);--mute:light-dark(#655c55,#b9ada3);
--line:light-dark(#ebe4dd,#352c27);--head:light-dark(#f3eee8,#2a241f);--track:light-dark(#e2d9cf,#4a3f36);
--gold:#e8a92b;--goldInk:#3a2600;--sage:light-dark(#5f8a4f,#8fbf7c);--sageBg:light-dark(#eef5ea,#1f2a1b);--sageInk:light-dark(#ffffff,#12200d);
--card:light-dark(#faf6f2,#211a17);--seg:light-dark(#e6ddd3,#3a312a);--segOn:light-dark(#ffffff,#57493e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:3;background:var(--head);border-bottom:1px solid var(--line);padding:14px 18px 12px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font:700 24px/1.1 "Familjen Grotesk",Figtree,sans-serif;margin:0}
.count{font:700 22px "Familjen Grotesk",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font:500 13px Figtree,sans-serif;color:var(--mute);margin-left:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--seg);border-radius:12px;padding:3px;margin-top:12px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:40px;font-weight:700;font-size:16px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--segOn);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar{height:6px;border-radius:9px;background:var(--track);overflow:hidden;margin:12px 0 4px}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;cursor:pointer;font-weight:600;font-size:15px}
.sw .tr{width:46px;height:28px;border-radius:99px;background:var(--track);position:relative;transition:background .2s}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked=true] .tr{background:var(--gold)}.sw[aria-checked=true] .tr::after{transform:translateX(18px)}
.hint{font-size:14px;color:var(--mute);margin:10px 0 0}
main{padding:4px 0 40px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:22px 18px 8px;border-bottom:2px solid var(--ink)}
.sec h2{font:700 20px "Familjen Grotesk",sans-serif;margin:0}.sec span{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.line{display:flex;border-bottom:1px solid var(--line)}
.row{flex:1;display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:transparent;border:0;padding:12px 18px;min-height:58px;cursor:pointer}
.ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--mute);display:grid;place-items:center}
.ck svg{width:16px;height:16px;opacity:0}
.nm{font-weight:600}
.plan .row.on{background:var(--sageBg)}.plan .row.on .ck{background:var(--sage);border-color:var(--sage)}.plan .row.on .ck svg{opacity:1;stroke:var(--sageInk)}
.shop .row.done .ck{background:var(--gold);border-color:var(--gold)}.shop .row.done .ck svg{opacity:1;stroke:var(--goldInk)}
.shop .row.done .nm{text-decoration:line-through;opacity:.55}
.del{background:none;border:0;color:#b3261e;min-width:52px;min-height:44px;font-size:24px;cursor:pointer}
.add{padding:20px 18px 6px;display:grid;gap:10px}
.add h3{font:700 18px "Familjen Grotesk",sans-serif;margin:0}
.add .f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.add input,.add select{min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);font-size:16px;width:100%}
.add button{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--gold);color:var(--goldInk);font-weight:700;cursor:pointer}
.err{color:#b3261e;font-size:14px;margin:0}
.empty{margin:28px 18px;padding:22px;border-radius:16px;background:var(--card);text-align:center}
.empty p{margin:0 0 14px;font-size:18px;font-weight:600}
.go{border:0;border-radius:12px;background:var(--gold);color:var(--goldInk);font-weight:700;min-height:48px;padding:0 20px;cursor:pointer}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:22px 18px}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer;font-weight:600;color:var(--mute)}
.ghost.arm{border-color:#b3261e;color:#b3261e}
.ghost[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
@media(min-width:700px){main,.hw{max-width:640px;margin-inline:auto}}
@media(prefers-reduced-motion:reduce){.bar i,.sw .tr,.sw .tr::after{transition:none}}
</style>
</head>
<body>
<header><div class="hw" id="head"></div></header>
<main id="main"></main>
<script>
{
const BASE=[
 ['produce','Produce',[['bananas','Bananas'],['grapes','Grapes'],['fruit','Fruit (seasonal)'],['salad','Salad mix'],['avocados','Avocados'],['carrots','Carrots'],['celery','Celery'],['onions','Onions'],['potatoes','Potatoes']]],
 ['bakery','Bakery',[['bread','Bread'],['baguette','Baguette']]],
 ['meat','Meat and seafood',[['thighs','Chicken thighs'],['salmon','Salmon'],['steak','Steak'],['stewbeef','Stew beef']]],
 ['dairy','Dairy and eggs',[['eggs','Eggs'],['butter','Butter'],['soymilk','Soy milk (Silk Vanilla)'],['yogurt','Yogurt, Meyer lemon'],['whips','Yoplait Whips'],['cheesesticks','Cheese sticks'],['cheddar','Sliced cheddar'],['shredded','Shredded cheese']]],
 ['pantry','Pantry',[['cereal','Cereal'],['rice','Rice'],['pasta','Pasta'],['noodles','Egg noodles'],['lentils','Lentils'],['driedpeas','Dried peas'],['whitebeans','White beans'],['tomatoes','Crushed tomatoes'],['chxbroth','Chicken broth'],['beefbroth','Beef broth'],['artichokes','Artichoke hearts, canned'],['avooil','Avocado oil'],['sunbutter','SunButter'],['jif','Jif peanut butter'],['honey','Honey'],['pancake','Pancake mix']]],
 ['snacks','Snacks',[['crackers','Crackers (for cheese)'],['cornchips','Corn chips'],['potatochips','Potato chips'],['pretzels','Pretzels'],['licorice','Licorice'],['fresca','Fresca']]],
 ['bev','Beverages',[['coffee','Coffee'],['tea','Tea'],['applejuice','Apple juice']]],
 ['frozen','Frozen',[['bao','Bao buns'],['peas','Peas'],['meatballs','Turkey meatballs']]],
 ['house','Household and paper',[['foil','Foil'],['foilpans','Foil pans, 8×8'],['bounty','Bounty paper towels'],['tp','Toilet paper'],['garbage','Garbage bags'],['windex','Windex']]]
];
const KEY='weekly-groceries';
let st={need:[],got:[],custom:[],tab:null,hide:false};
try{st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let need=new Set(st.need),got=new Set(st.got),err='';
if(!st.tab)st.tab=need.size?'shop':'plan';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({need:[...need],got:[...got],custom:st.custom,tab:st.tab,hide:st.hide}))}catch(e){}};
const CK='<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const head=document.getElementById('head'),main=document.getElementById('main');
const secs=()=>[...BASE.map(([k,name,items])=>[k,name,items]),['other','Other items',st.custom.map(c=>[c.id,c.name,true])]];
const addForm=label=>`<form class="add" id="add"><h3>${label}</h3><div class="f"><input id="newName" placeholder="Paper plates" aria-label="Item name" autocomplete="off"><button type="submit">Add</button></div>${err?`<p class="err">${err}</p>`:''}</form>`;
function renderHead(){
 const total=need.size,inCart=[...need].filter(id=>got.has(id)).length,left=total-inCart;
 const tabs=`<div class="seg" role="tablist"><button role="tab" data-tab="plan" aria-selected="${st.tab==='plan'}">Plan</button><button role="tab" data-tab="shop" aria-selected="${st.tab==='shop'}">Shop</button></div>`;
 if(st.tab==='plan'){
  head.innerHTML=`<div class="top"><h1>Groceries</h1><div class="count">${total}<small>on this week’s list</small></div></div>${tabs}<p class="hint">Tap what you need this week.</p>`;
 }else{
  head.innerHTML=`<div class="top"><h1>Groceries</h1><div class="count">${left}<small>to get</small></div></div>${tabs}<div class="bar"><i style="width:${total?Math.round(inCart/total*100):0}%"></i></div><div class="ctrl"><button class="sw" id="hide" role="switch" aria-checked="${st.hide}"><span class="tr" aria-hidden="true"></span>Hide done</button></div>`;
 }
}
function renderPlan(){
 let h='';
 for(const [k,name,items] of secs()){
  if(!items.length)continue;
  h+=`<div class="sec"><h2>${name}</h2><span>${items.filter(i=>need.has(i[0])).length}/${items.length}</span></div>`;
  h+=items.map(([id,nm,mine])=>`<div class="line"><button class="row${need.has(id)?' on':''}" data-pick="${id}" aria-pressed="${need.has(id)}"><span class="ck" aria-hidden="true">${CK}</span><span class="nm">${esc(nm)}</span></button>${mine?`<button class="del" data-del="${id}" aria-label="Remove ${esc(nm)} from your list">×</button>`:''}</div>`).join('');
 }
 h+=addForm('Add an item');
 main.className='plan';main.innerHTML=h;
}
function renderShop(){
 if(!need.size){main.className='shop';main.innerHTML=`<div class="empty"><p>Nothing on this week’s list yet.</p><button class="go" data-tab="plan">Pick items in Plan</button></div>`+addForm('Add an item to this week');return}
 let h='',left=0;
 for(const [k,name,items] of secs()){
  const mine=items.filter(i=>need.has(i[0]));if(!mine.length)continue;
  const shown=mine.filter(i=>!(st.hide&&got.has(i[0])));left+=mine.filter(i=>!got.has(i[0])).length;
  if(!shown.length)continue;
  h+=`<div class="sec"><h2>${name}</h2><span>${mine.filter(i=>got.has(i[0])).length}/${mine.length}</span></div>`;
  h+=shown.map(([id,nm])=>`<div class="line"><button class="row${got.has(id)?' done':''}" data-got="${id}" aria-pressed="${got.has(id)}"><span class="ck" aria-hidden="true">${CK}</span><span class="nm">${esc(nm)}</span></button></div>`).join('');
 }
 if(!left)h=`<div class="empty"><p>Everything’s in the cart.</p></div>`+h;
 h+=addForm('Add an item to this week');
 main.className='shop';main.innerHTML=h;
}
function render(){renderHead();st.tab==='plan'?renderPlan():renderShop()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){st.tab=t.dataset.tab;err='';save();render();window.scrollTo(0,0);return}
 if(e.target.closest('#hide')){st.hide=!st.hide;save();render();return}
 const p=e.target.closest('[data-pick]');if(p){const id=p.dataset.pick;if(need.has(id)){need.delete(id);got.delete(id)}else need.add(id);save();render();return}
 const g=e.target.closest('[data-got]');if(g){const id=g.dataset.got;got.has(id)?got.delete(id):got.add(id);save();render();return}
 const d=e.target.closest('[data-del]');if(d){const id=d.dataset.del;st.custom=st.custom.filter(c=>c.id!==id);need.delete(id);got.delete(id);save();render();return}
});
main.addEventListener('submit',e=>{
 e.preventDefault();
 const name=document.getElementById('newName').value.trim();
 if(!name){err='Type an item name first.';render();document.getElementById('newName').focus();return}
 const all=secs().flatMap(s=>s[2]);
 const dup=all.find(i=>i[1].toLowerCase()===name.toLowerCase());
 const id=dup?dup[0]:'c'+Date.now();
 if(!dup)st.custom.push({id,name});
 need.add(id);err='';save();render();
 const f=document.getElementById('newName');if(f)f.focus();
});
main.addEventListener('input',e=>{if(e.target.id==='newName'&&err){err='';const p=main.querySelector('.err');if(p)p.remove()}});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
